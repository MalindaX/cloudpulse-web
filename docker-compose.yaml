services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: cloudpulse-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
